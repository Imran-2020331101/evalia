# Infrastructure for the e2e / smoke layers. The Node services and the Spring gateway are run
# from source on the host (see tests/README.md) because several of them hard-code
# amqp://localhost:5672 and redis://localhost:6379 (job-service/src/utils/notify.ts,
# notification-service/src/events/messageBroker.ts, resume-service/src/config/redisClient.ts),
# so they must share the host network namespace with these published ports.
name: evalia-test

services:
  mongo:
    image: mongo:7
    ports: ["27017:27017"]
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 5s
      timeout: 5s
      retries: 20
    tmpfs: ["/data/db"]

  rabbitmq:
    image: rabbitmq:3.13-management
    ports: ["5672:5672", "15672:15672"]
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 5s
      timeout: 10s
      retries: 20

  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  qdrant:
    image: qdrant/qdrant:v1.15.1
    ports: ["6333:6333", "6334:6334"]
    tmpfs: ["/qdrant/storage"]
