# Test profile: no real MongoDB, SMTP, Cloudinary or downstream services are contacted.
# Mongo auto-configuration is disabled; Mongo repositories are replaced by Mockito mocks in the ITs.
spring.autoconfigure.exclude=\
  org.springframework.boot.autoconfigure.mongo.MongoAutoConfiguration,\
  org.springframework.boot.autoconfigure.data.mongo.MongoDataAutoConfiguration,\
  org.springframework.boot.autoconfigure.data.mongo.MongoRepositoriesAutoConfiguration

# 80 bytes: HS512 requires a key of at least 512 bits
jwt.secret=test-secret-test-secret-test-secret-test-secret-test-secret-test-secret-12345678
jwt.expiration=3600000

FRONTEND_URL=http://localhost:3000

# Downstream services (Feign clients are mocked in ITs; URLs only need to resolve as placeholders)
resume.service.url=http://localhost:59991
job.service.url=http://localhost:59992
interview.service.url=http://localhost:59993
notification.service.url=http://localhost:59994

# OAuth2 client registrations (static values, no discovery / network at startup)
spring.security.oauth2.client.registration.google.client-id=test-google-id
spring.security.oauth2.client.registration.google.client-secret=test-google-secret
spring.security.oauth2.client.registration.google.scope=openid,profile,email
spring.security.oauth2.client.registration.github.client-id=test-github-id
spring.security.oauth2.client.registration.github.client-secret=test-github-secret
spring.security.oauth2.client.registration.github.scope=user:email,read:user

spring.main.banner-mode=off
logging.level.root=WARN
